name: PairDock CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend
        run: dotnet restore backend/src/SanskarConnectX.Api/SanskarConnectX.Api.csproj
      - name: Build backend
        run: dotnet build backend/src/SanskarConnectX.Api/SanskarConnectX.Api.csproj --configuration Release --no-restore
      - name: Build protocol and SDK
        run: |
          dotnet build shared/protocol/csharp/SanskarConnectX.Protocol.csproj --configuration Release
          dotnet build sdk/SanskarConnectX.Sdk.csproj --configuration Release
      - name: Firmware host build
        run: |
          cmake -S firmware -B firmware/build
          cmake --build firmware/build
          ctest --test-dir firmware/build --output-on-failure
